index_version: v1
chunk_size: 120
overlap: 20
embed_dim: 2048
top_k: 3
# Relevance threshold: chunks scoring below this are treated as "nothing
# relevant retrieved" -> the generator refuses instead of hallucinating.
# Tuned on evals/golden.jsonl, not derived. Re-tune when the corpus changes.
min_score: 0.15

# Store backend: "numpy" (default, in-memory brute force, zero deps) or
# "pgvector" (Postgres + pgvector — needs docker-compose.yml running and
# PGVECTOR_DSN set; see store_pgvector.py for the setup). Both answer the
# same upsert/search/save/load interface, so the pipeline doesn't care.
store_backend: numpy

# Retriever backend: "dense" (default, embeddings + cosine), "bm25"
# (rank-bm25 sparse keyword retrieval), or "hybrid" (reciprocal rank
# fusion of both — keyword-exact and fuzzy matches reinforce each other).
# All three answer the same interface, so pipeline.py, service.py and the
# evals work unchanged either way.
retriever: dense

# Hybrid fusion weights (only used when retriever: hybrid):
# hybrid_alpha weighs the dense list's ranks, (1 - alpha) the BM25 list's.
# 0.5 = even; 1.0 = dense only; 0.0 = BM25 only.
hybrid_alpha: 0.5
# how many candidates each backend contributes to the fusion before the
# top_k cut — RRF needs depth to see where the backends agree/disagree
hybrid_depth: 20

# Reranking (second retrieval stage — OFF by default so the live demo's
# behaviour doesn't change): when rerank: true, the pipeline pulls
# rerank_depth candidates with the first-stage retriever, then re-scores
# them with a cross-encoder down to rerank_top_n. Slower but more
# precise — the cross-encoder reads the query and the chunk together, so
# it catches word order and negation the first stage can't. The
# reranker's scores are in [0, 1], so the min_score gate above applies
# to them unchanged (junk queries still get refused).
rerank: false
rerank_depth: 20
rerank_top_n: 5
# rerank_backend: "cross_encoder" (default, bge-reranker-base via
# sentence-transformers; degrades to "lexical" with a log line when the
# package or the model can't load) or "lexical" (zero deps — a
# query-token-overlap stand-in, see reranker.py's # SWAP note).
rerank_backend: cross_encoder
# lighter swap for CPU boxes: cross-encoder/ms-marco-MiniLM-L-6-v2
rerank_model: BAAI/bge-reranker-base
# Query rewriting (multi-query expansion — OFF by default so the live
# demo's behaviour doesn't change): when rewrite: true, one query fans
# out to rewrite_variants variants (mock LLM in rewriter.py, marked
# # SWAP for the real call) and the per-variant retrieval lists merge
# with dedupe before the min_score gate. Ambiguous queries that use the
# "wrong" words now get extra chances to hit the right chunks.
rewrite: false
rewrite_variants: 3

# Generator backend: "auto" (default, real model when LLM_API_KEY is
# configured — the 2026-09-27 behavior — else the extractive mock),
# "mock" (always the offline extractive stand-in, key ignored), or
# "openai" (OpenAI-compatible /chat/completions: key from OPENAI_API_KEY
# or LLM_API_KEY, default model gpt-4o-mini, OPENAI_BASE_URL + LLM_MODEL
# overrides). With generator: openai and no key, the pipeline logs one
# line and falls back to the mock — nothing crashes.
generator: auto

# Semantic query cache (exact + near-duplicate): when enabled, /query
# first checks an exact-match cache (sha of the normalized question),
# then an embedding-similarity cache (cosine over hashing bag-of-words
# vectors — # SWAP a real embedder in cache.py for production). Hits
# skip the pipeline and return the stored answer with "cached": true;
# re-indexing clears the cache. /health reports hits/misses/hit_rate.
semantic_cache:
  enabled: true
  threshold: 0.85
  max_entries: 256

# Latency logging: each pipeline.answer()/answer_stream() appends one JSON
# line per query (stage timings + question + backend) to this file —
# evals/latency_summary.py turns it into a p50/p99 table. null disables
# logging entirely. logs/ is gitignored: timing data is local noise, not
# repo content.
latency_log: logs/latency.jsonl

# Embedder backend: "hashing" (default, zero deps) or "st"
# (sentence-transformers, real neural embeddings). st is lazy-imported and
# falls back to hashing with a log line if the package or model is
# unavailable, so an offline box never crashes.
embedder_backend: hashing
# model used when embedder_backend is "st" (384 dims for all-MiniLM-L6-v2)
st_model: all-MiniLM-L6-v2
