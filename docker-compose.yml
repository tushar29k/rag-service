# local pgvector for the rag-service store backend.
#   docker compose up -d pgvector
#   export PGVECTOR_DSN=postgresql://rag:rag@localhost:5432/rag
# then set store_backend: pgvector in config.yaml.
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
